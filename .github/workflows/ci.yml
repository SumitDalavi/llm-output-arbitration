name: CI Pipeline
'on':
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Node.js Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install Dependencies
        run: cd server && npm install
      - name: Build Server
        run: cd server && npm run build
      - name: Run Tests
        run: cd server && npm test
