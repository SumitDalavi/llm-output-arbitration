version: '3.8'
services:
  server:
    build: ./server
    ports:
      - '4000:4000'
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=arbitration
      - DB_PORT=5432
      - NODE_ENV=production
    depends_on:
      - postgres

  client:
    build: ./client
    ports:
      - '8080:8080'
    depends_on:
      - server

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arbitration
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
